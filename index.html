<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabin-Karp Algorithm Visualizer</title>
    <style>
        :root {
            --bg: #f8fafc;
            --text-main: #1e293b;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --tile-bg: #f1f5f9;
            --tile-size: 50px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .controls {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            text-transform: uppercase;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .viz-container {
            background: var(--card-bg);
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            position: relative;
            min-height: 250px;
        }

        .string-row {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            position: relative;
        }

        #pattern-row {
            position: absolute;
            transition: left 0.5s ease-in-out;
            left: 0;
        }

        .char-tile {
            width: var(--tile-size);
            height: var(--tile-size);
            background: var(--tile-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .char-tile.active { border-color: var(--primary); box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .char-tile.match { background: var(--success); color: white; border-color: var(--success); }
        .char-tile.mismatch { background: var(--error); color: white; border-color: var(--error); }

        .info-panel {
            margin-top: 2rem;
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .info-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .hash-value {
            font-size: 2rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--primary);
            margin: 0.5rem 0;
        }

        #status-msg {
            grid-column: 1 / -1;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 1.2rem;
            background: var(--tile-bg);
        }

        .formula {
            font-family: monospace;
            background: var(--bg);
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
            display: block;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Rabin-Karp Algorithm</h1>
        <p>Step-by-step visualizer for string matching using Rolling Hashes</p>
    </div>

    <div class="controls">
        <label>Text: <input type="text" id="text-input" value="ABCCABBC" maxlength="15"></label>
        <label>Pattern: <input type="text" id="pattern-input" value="ABB" maxlength="5"></label>
        <button id="start-btn">Start / Reset</button>
        <button id="step-btn" disabled>Next Step</button>
    </div>

    <div class="viz-container">
        <div class="string-row" id="text-row"></div>
        <div style="position: relative; height: 60px;">
            <div class="string-row" id="pattern-row"></div>
        </div>
    </div>

    <div class="info-panel">
        <div id="status-msg">Click 'Start' to begin.</div>
        <div class="info-card">
            <h3>Target Pattern Hash</h3>
            <div class="hash-value" id="pattern-hash">-</div>
            <small>Calculated once at the beginning.</small>
        </div>
        <div class="info-card">
            <h3>Current Window Hash</h3>
            <div class="hash-value" id="window-hash">-</div>
            <code class="formula" id="hash-formula">Awaiting calculation...</code>
        </div>
    </div>

    <script>
        // Prime modulus and base for hashing (kept small for presentation readability)
        const q = 101; 
        const d = 256; 

        let text = "";
        let pattern = "";
        let currentPos = 0;
        let pHash = 0;
        let tHash = 0;
        let h = 1;
        let stepState = 0; // 0: Compare Hash, 1: Verify Chars, 2: Slide & Roll

        const textRow = document.getElementById('text-row');
        const patternRow = document.getElementById('pattern-row');
        const stepBtn = document.getElementById('step-btn');
        const startBtn = document.getElementById('start-btn');
        const statusMsg = document.getElementById('status-msg');
        const pHashDisplay = document.getElementById('pattern-hash');
        const tHashDisplay = document.getElementById('window-hash');
        const formulaDisplay = document.getElementById('hash-formula');

        function init() {
            text = document.getElementById('text-input').value.toUpperCase();
            pattern = document.getElementById('pattern-input').value.toUpperCase();
            
            if (!text || !pattern || pattern.length > text.length) {
                alert("Please enter valid text and pattern (Pattern must be shorter than Text).");
                return;
            }

            // Reset UI
            textRow.innerHTML = '';
            patternRow.innerHTML = '';
            patternRow.style.left = '0px';
            currentPos = 0;
            stepState = 0;
            stepBtn.disabled = false;

            // Render Tiles
            for (let char of text) {
                let div = document.createElement('div');
                div.className = 'char-tile text-tile';
                div.innerText = char;
                textRow.appendChild(div);
            }
            for (let char of pattern) {
                let div = document.createElement('div');
                div.className = 'char-tile pattern-tile';
                div.innerText = char;
                patternRow.appendChild(div);
            }

            // Pre-calculate 'h' = Math.pow(d, M-1) % q
            h = 1;
            for (let i = 0; i < pattern.length - 1; i++) {
                h = (h * d) % q;
            }

            // Initial Hashes
            pHash = 0;
            tHash = 0;
            for (let i = 0; i < pattern.length; i++) {
                pHash = (d * pHash + pattern.charCodeAt(i)) % q;
                tHash = (d * tHash + text.charCodeAt(i)) % q;
            }

            pHashDisplay.innerText = pHash;
            tHashDisplay.innerText = tHash;
            updateStatus(`Initial Hashes Calculated. Ready to compare window 0.`, "var(--tile-bg)");
            formulaDisplay.innerText = `Initial Window Hash`;
            highlightWindow(0, 'active');
        }

        function step() {
            let M = pattern.length;
            let N = text.length;
            
            resetHighlights();
            highlightWindow(currentPos, 'active');

            if (stepState === 0) {
                // Step 1: Compare Hashes
                if (pHash === tHash) {
                    updateStatus(`Hashes Match (${pHash} == ${tHash})! Now verifying characters...`, "var(--warning)");
                    stepState = 1;
                } else {
                    updateStatus(`Hashes Mismatch (${pHash} != ${tHash}). Characters are definitely different.`, "var(--tile-bg)");
                    stepState = 2; // Skip to slide
                }
            } 
            else if (stepState === 1) {
                // Step 2: Verify Characters (Only if hash matched)
                let match = true;
                for (let j = 0; j < M; j++) {
                    if (text[currentPos + j] !== pattern[j]) {
                        match = false;
                        break;
                    }
                }

                if (match) {
                    updateStatus(`Exact Match Found at index ${currentPos}!`, "var(--success)");
                    highlightWindow(currentPos, 'match');
                    document.querySelectorAll('.pattern-tile').forEach(t => t.classList.add('match'));
                    stepState = 2; // Continue searching
                } else {
                    updateStatus(`Spurious Hit (Hash Collision)! Characters don't match.`, "var(--error)");
                    highlightWindow(currentPos, 'mismatch');
                    document.querySelectorAll('.pattern-tile').forEach(t => t.classList.add('mismatch'));
                    stepState = 2;
                }
            } 
            else if (stepState === 2) {
                // Step 3: Slide and compute Rolling Hash
                if (currentPos < N - M) {
                    let oldChar = text.charCodeAt(currentPos);
                    let newChar = text.charCodeAt(currentPos + M);
                    
                    // Slide UI
                    currentPos++;
                    patternRow.style.left = `${currentPos * 58}px`; // 50px width + 8px gap
                    
                    // Rolling Hash Math: tHash = (d * (tHash - txt[i]*h) + txt[i+M]) % q
                    let oldHash = tHash;
                    tHash = (d * (tHash - oldChar * h) + newChar) % q;
                    if (tHash < 0) tHash = (tHash + q); // Handle negative modulo in JS

                    tHashDisplay.innerText = tHash;
                    formulaDisplay.innerText = `New = (d * (${oldHash} - '${String.fromCharCode(oldChar)}'*h) + '${String.fromCharCode(newChar)}') % q`;
                    
                    updateStatus(`Window slid right. Rolling Hash calculated in O(1) time.`, "var(--tile-bg)");
                    resetHighlights();
                    highlightWindow(currentPos, 'active');
                    stepState = 0;
                } else {
                    updateStatus(`Search Complete! Reached the end of the text.`, "var(--tile-bg)");
                    stepBtn.disabled = true;
                    resetHighlights();
                }
            }
        }

        function highlightWindow(pos, className) {
            let tiles = document.querySelectorAll('.text-tile');
            for (let i = 0; i < pattern.length; i++) {
                if (tiles[pos + i]) {
                    tiles[pos + i].classList.add(className);
                }
            }
        }

        function resetHighlights() {
            document.querySelectorAll('.char-tile').forEach(t => {
                t.classList.remove('active', 'match', 'mismatch');
            });
        }

        function updateStatus(msg, bgColor) {
            statusMsg.innerText = msg;
            statusMsg.style.background = bgColor;
            statusMsg.style.color = bgColor === "var(--tile-bg)" ? "var(--text-main)" : "white";
        }

        startBtn.addEventListener('click', init);
        stepBtn.addEventListener('click', step);

        // Initialize on load
        init();
    </script>
</body>
</html>
